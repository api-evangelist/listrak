notes: >-
  Listrak has no developer changelog. There is no release-notes feed on the developer page, no dated
  API changelog in any of the eight specs, and no /changelog route on api.listrak.com. What exists is
  a PRODUCT updates collection in the Intercom-hosted help center: one article per year since 2021,
  each grouped by quarter, mixing platform/UI releases with the occasional API change. Entries carry
  no version numbers and no exact dates - the quarter is the finest granularity Listrak publishes -
  so `date` below is the quarter, honestly. An API consumer cannot subscribe to this and cannot diff
  it; the API-affecting items have to be read out of a marketing-shaped list. Recent window only.
