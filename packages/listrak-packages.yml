notes: >-
  Listrak ships NO server-side REST client library in any language. Its API docs teach the APIs with
  raw HTTP plus generic third-party helpers (Newtonsoft.Json for C#, Guzzle 6 for PHP) rather than a
  Listrak SDK. The only first-party client code Listrak publishes is the pair of mobile App Push
  SDKs on its GitHub org - and neither is in a package registry: the Android SDK is a bare Maven
  repository layout committed into the GitHub repo, the iOS SDK is a zipped framework referenced by
  a hand-maintained JSON version manifest. Both sit at 1.0.0 and neither repo has been pushed to
  since February 2021, while the App Push Mobile Client API they wrap is still live and documented.
  That five-year gap is the decay signal worth recording. CocoaPods has no `Listrak` pod and Maven
  Central returns zero results for `listrak`, so there is no registry-published version for either.
