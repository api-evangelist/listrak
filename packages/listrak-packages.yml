  published: '2019-08-07'
  official: true
  note: >-
    Published by npm user dgomez-ltk with the maintainer email dgomez@listrak.com, which is why this
    is recorded as first-party. It is NOT a general-purpose Listrak API client - the package
    describes itself as "Listrak SegmentIO Integration" and its repository field points at
