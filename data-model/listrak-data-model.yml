id_conventions:
- pattern: numeric surrogate ids
  applies_to: [listId, messageId, campaignId, segmentationFieldId, eventId, folderId, phoneListId, shortCodeId, directoryId, fileId]
  note: Listrak uses plain integer identifiers. There are no prefixed/typed ids (no `cus_`-style prefixes), so an id carries no type information on its own.
- pattern: opaque contact key
  applies_to: [emailKey, universalEmailKey]
  note: emailKey identifies a contact within a list; universalEmailKey identifies the same email across lists when the list has enableUniversalEmailKeySetting on.
- pattern: merchant-owned natural keys
  applies_to: [customerNumber, orderNumber, sku, providerReviewID, providerProductID, externalContactID, externalCampaignId]
  note: The Data Import API is upsert-by-merchant-key; the merchant's own identifiers are the primary keys, which is why those imports are naturally idempotent even though no idempotency contract is published.
- pattern: meta slots
  applies_to: [Customer, Order, OrderItem, Product]
  note: Exactly five untyped meta1..meta5 string slots per entity. This is the only extensibility on the retail-data side - there is no arbitrary metadata map.
