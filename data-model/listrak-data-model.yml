notes: >-
  Entity-relationship graph derived from the schema definitions and the route hierarchy of Listrak's
  own specs. Listrak's identity model is worth stating up front because it explains most of the
  graph: there is no single global "customer" object. The Email API keys contacts by
  emailAddress/emailKey per LIST, the SMS API keys subscribers by phoneNumber per SENDER CODE, and
  the Data Import API keys retail records by the merchant's own customerNumber/orderNumber/sku. The
  Listrak Data Platform is what stitches those together internally; the public APIs do not expose a
  join key across them, and `universalEmailKey` (Email) plus `externalContactID` are the closest
  things to a cross-list identifier. Nearly every email-side route is nested under
  /List/{listId}/..., so listId is the dominant foreign key on the marketing side.
