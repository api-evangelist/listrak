format: vendor-error-codes
notes: >-
  Listrak does NOT use RFC 9457 problem+json. It returns a flat vendor envelope on
  `application/json` with three required members - `status`, `error`, `message` - where `error` is a
  stable SCREAMING_SNAKE error code drawn from the registry below. The registry is published inside
  the `info.description` of the Email, SMS and Media specs (an "# Error Codes" section), which is
  why it does not appear in any response schema and is invisible to a spec-only derivation. Captured
  verbatim by SEARCH of the live specs. The `error` code is the value to branch on; `message` is
  human prose and is not a contract.
envelope:
  media_type: application/json
  shape:
    status: integer or numeric string - the HTTP status, repeated in the body
    error: string - the stable error code
    message: string - human-readable explanation
  example: '{"status":401,"error":"ERROR_UNAUTHORIZED","message":"Authorization was denied for this request."}'
  observed:
    url: https://api.listrak.com/email/swagger.json
    http_status: 401
    fetched: '2026-08-13'
    note: The envelope above was observed live on an unauthenticated request, not only read from docs.
  schema_refs:
  - openapi/_original/listrak-media-openapi.json#/components/schemas/ErrorResponse
  - openapi/_original/listrak-email-openapi.json#/definitions/Error
http_statuses:
- status: 200
  title: OK
  meaning: The request succeeded.
- status: 201
  title: Created
  meaning: A new resource has been created.
- status: 202
  title: Accepted
  meaning: The request was accepted for asynchronous processing.
- status: 204
  title: No Content
  meaning: The request was processed successfully but there is no content to return.
- status: 400
  title: Bad Request
  meaning: The request is malformed or invalid.
- status: 401
  title: Unauthorized
  meaning: Authentication is required, or the bearer token is invalid/expired.
- status: 403
  title: Forbidden
  meaning: Authenticated but not permitted - insufficient access level, missing role, or unauthorized IP.
- status: 404
  title: Not Found
  meaning: The resource does not exist. Also returned when an undisclosed payload size limit is exceeded.
- status: 405
  title: Method Not Allowed
  meaning: The route does not support the requested HTTP method.
- status: 409
  title: Conflict
  meaning: The request would result in conflicting resources.
- status: 415
  title: Unsupported Media Type
  meaning: Use a Content-Type of application/json.
- status: 429
  title: Too Many Requests
  meaning: The request rate limit has been exceeded. See rate-limits/listrak-rate-limits.yml.
- status: 500
  title: Internal Server Error
  meaning: An unexpected error occurred; Listrak's development team is notified automatically.
error_codes:
- code: ERROR_INVALID_CREDENTIALS
  group: general
  apis: [Email, SMS]
  cause: Invalid client credentials, inactive integration, or unauthorized IP address.
  remediation: Re-check the client_id/client_secret pair, confirm the Integration is active and not paused, and confirm the calling IP is allowed on the Integration.
- code: ERROR_UNAUTHORIZED
  group: general
  apis: [Email, SMS, Media]
  http: 401
  cause: Invalid access token, inactive integration, insufficient access level, or unauthorized IP address.
  remediation: Request a fresh token from https://auth.listrak.com/OAuth2/Token and confirm the Integration grants the scope the route requires.
- code: ERROR_FORBIDDEN
  group: general
  apis: [Media]
  http: 403
  cause: Token lacks the Media role or the CompanyID / MasterAdminID claims.
  remediation: Grant the Integration Media access and re-issue the token.
