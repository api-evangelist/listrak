                  subscribeDate: null
                  unsubscribeDate: null
                  phoneNumber: null
                  emailAddress: null
                  firstName: null
                  lastName: null
                  birthday: null
                  postalCode: null
                  optedOut: false
                  segmentationFieldValues: null
