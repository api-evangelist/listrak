        source: "$client = new \\GuzzleHttp\\Client([\n\t'base_uri' => '/'\n]);\n\n$res = $client->request('GET', 'v1/ShortCode/{senderCodeId}/Contact/{phoneNumber}',  [\n\t'headers' => ['Authorization' => 'Bearer ' . $accessToken]\n]);\n"
