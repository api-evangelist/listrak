legacy_surface:
  name: Listrak v31 SOAP API
  status: superseded by the REST APIs
  evidence: >-
    Third-party wrappers for a "Listrak v31 SOAP API" exist (github.com/joepetrini/python-listrak)
    but Listrak publishes no SOAP endpoint, WSDL, or migration note on its current developer page.
    The retirement of that surface was never documented publicly.
