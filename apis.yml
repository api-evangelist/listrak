aid: listrak
name: Listrak
description: >-
  Listrak is a retail customer-engagement platform whose public API surface is eight separate REST
  APIs served from api.listrak.com: Email (83 operations), SMS (20), Data Import (5), Media (9),
  Mobile App Push (5), Two-Way SMS (4), Cross Channel custom events (3) and Privacy (2). Together
  they cover contacts and lists, message authoring and transactional sends, profile-field
  segmentation, behavioral events that drive Journey Hub automations, bulk upsert of retail
  customers, orders, products and reviews, media library management, mobile device registration,
  two-way SMS support conversations, and GDPR/CCPA forget requests. Every server-side API
  authenticates with OAuth 2.0 client_credentials against a single token endpoint at
  auth.listrak.com, returns a consistent {status, error, message} envelope drawn from a published
  68-code error registry, and pages with cursor plus count.
